# Zusätzliche Docspell-Joex-Konfiguration (HOCON-Format). Joex führt OCR/Textextraktion
# und Klassifizierung aus. Siehe https://docspell.org/docs/configure/ (Abschnitt "joex").
#
# Für Belege auf Deutsch/Englisch lohnt es sich, hier später die OCR-Sprachen zu setzen,
# z.B. Tesseract-Sprachpakete "deu+eng". Vor dem ersten Start mit der Doku abgleichen.
#
# Docspells eingebauter Klassifikator (automatische Tag-Vorschläge für neue Belege,
# lernt aus bereits von euch korrekt getaggten Dokumenten) lässt sich hier aktivieren
# — Config-Schlüssel etwa "docspell.joex.text-analysis.classification.enabled" o.ä.,
# exakte Bezeichnung bitte gegen https://docspell.org/docs/configure/ (Abschnitt
# "joex" → "classification") prüfen, da hier nicht live verifizierbar.
#
# Praktischer Nutzen in diesem Setup: sobald ein paar Dutzend Belege pro
# Correspondent (Amazon, PayPal, AliExpress, ...) korrekt getaggt sind, schlägt
# Docspell für neue, unbekannte Absender ähnliche Tags vor — spart manuelles
# Nachsortieren bei Belegen ausserhalb der festen Regeln in config/sources.yaml.
{}
