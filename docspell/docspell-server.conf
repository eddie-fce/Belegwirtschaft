# Zusätzliche Docspell-Server-Konfiguration (HOCON-Format).
#
# Der Grossteil der Konfiguration läuft über Umgebungsvariablen in docker-compose.yml
# (Datenbank, Solr, Integration-Endpoint). Diese Datei ist für alles, was sich nicht
# sinnvoll per Env-Var abbilden lässt (z.B. feingranulare OCR- oder Mail-Einstellungen).
#
# Bitte vor dem ersten Start mit der aktuellen Referenz abgleichen:
# https://docspell.org/docs/configure/  (Abschnitt "server")
#
# Leer lassen ist ok — Docspell nutzt dann seine eingebauten Defaults plus die Env-Vars.
