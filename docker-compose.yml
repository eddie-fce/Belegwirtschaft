# Belegwirtschaft — lokales, selbst gehostetes Belegmanagement auf Basis von Docspell.
#
# WICHTIG: Die Image-Registry wurde im Praxisbetrieb korrigiert (ghcr.io statt
# des archivierten "docspell/restserver" auf Docker Hub, siehe Kommentar bei
# docspell-restserver unten) — das ist jetzt verifiziert. Die Docspell-Env-Var-
# Namen selbst stammen weiterhin nach bestem Wissen aus der offiziellen Doku
# (https://docspell.org/docs/install/docker/), ohne Möglichkeit zur Live-Prüfung
# beim Erstellen dieses Setups — bei unerwartetem Verhalten dort gegenchecken.
# Alles andere (Connectors, Volumes, Netzwerktrennung) ist eigenständig.
#
# Alle Daten (Belege, Datenbank, Sessions) landen ausschliesslich in ./data auf diesem Host.
# Es gibt keine Verbindung nach aussen ausser der Gmail-API (Google) — nur vom
# Gmail-Connector-Container aus, niemals vom Docspell-Kern selbst.
#
# Amazon Business hat bewusst KEINEN eigenen Connector: bei 1-2 Rechnungs-Exporten
# im Jahr lohnt sich weder eine Amazon-Entwickler-Registrierung noch eine gegen
# Amazons UI geschriebene Browser-Automatisierung. Stattdessen: manueller
# Business-Analytics-Bulk-Export -> Dropzone, siehe docs/amazon-business-export.md.
#
# Speicherlimits (mem_limit) unten sind für kleine NAS-Systeme (z.B. QNAP mit
# ~4 GB RAM neben dem laufenden QTS/QuTS) bewusst knapp bemessen — siehe
# docs/deploy-qnap.md für Hintergrund und Anpassung. Auf einem Server mit viel
# RAM können diese Zeilen einfach entfernt werden.
#
# Jede von Gmail-/Dropzone-Connector hochgeladene Datei landet zusätzlich zu
# Docspell (durchsuchbar/getaggt) unverändert in ./data/belege-nach-monat/
# <Jahr>/<Eingang oder Ausgang>/<Monat>/ — ein echter, per File Station
# browsbarer Ordnerbaum für den Steuerberater, sortiert nach bestmöglicher
# Datumsnäherung (Mail-Datum bei Gmail, Datei-mtime bei Dropzone/Scans).
# Siehe connectors/common/monthly_mirror.py.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  solr:
    image: solr:9
    restart: unless-stopped
    mem_limit: 512m
    # SOLR_HEAP begrenzt den JVM-Heap explizit (sonst nimmt sich Solr per Default
    # einen Anteil des System-RAM statt des Container-Limits) — wichtig auf
    # kleinen NAS-Systemen. Bei mehr verfügbarem RAM einfach erhöhen.
    environment:
      SOLR_HEAP: 384m
      # Docspells Schema-Migration braucht für das Khmer-Feld
      # solr.ICUTokenizerFactory aus dem Solr-Contrib-Modul "analysis-extras",
      # das im Standard-Image nicht geladen ist. Ohne das bricht die
      # Volltext-Index-Migration bei jedem Durchlauf endgültig an dieser
      # Stelle ab (alle folgenden Schritte inkl. der Versions-Markierung
      # werden nie erreicht, daher startet sie bei jedem joex-Neustart von
      # vorn) — betrifft nur Khmer, Deutsch/Englisch/Französisch etc. laufen
      # unabhängig davon normal.
      SOLR_MODULES: analysis-extras
    command: ["solr-precreate", "docspell"]
    volumes:
      - ./data/solr:/var/solr
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8983/solr/admin/cores?action=STATUS || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  docspell-restserver:
    # WICHTIG: Das alte "docspell/restserver" auf Docker Hub ist archiviert
    # (letzter Tag dort: v0.42.0, kein v0.43.0). Docspell veröffentlicht Images
    # jetzt unter ghcr.io — bestätigt gegen https://github.com/docspell/docker
    # (offizielles docker-compose-Beispiel dort). "latest" ist der dort
    # verifizierte, funktionierende Wert; eine bestimmte Version zu pinnen war
    # zum Zeitpunkt dieser Änderung nicht zuverlässig prüfbar (ghcr.io zeigt
    # Tags nicht ohne Weiteres in einer einfach durchsuchbaren Liste) — bei
    # Bedarf https://github.com/docspell/docspell/pkgs/container/restserver
    # nach konkreten Versions-Tags durchsuchen und in .env eintragen.
    image: ghcr.io/docspell/restserver:${DOCSPELL_VERSION}
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
    environment:
      DOCSPELL_SERVER_BACKEND_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DOCSPELL_SERVER_BACKEND_JDBC_USER: ${POSTGRES_USER}
      DOCSPELL_SERVER_BACKEND_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      # WICHTIG zur Env-Var-Syntax (siehe docspell/config/EnvConfig.scala): ein
      # einzelner Unterstrich wird zu einem Punkt (Verschachtelung), ZWEI
      # Unterstriche werden zu einem Bindestrich. Config-Schlüssel wie
      # "full-text-search" oder "integration-endpoint" enthalten Bindestriche
      # und brauchen daher an der Stelle "__" (doppelt) — ein einzelner
      # Unterstrich landet sonst auf einem falschen, nicht existierenden Pfad
      # und wird stillschweigend ignoriert (kein Fehler, einfach wirkungslos).
      DOCSPELL_SERVER_FULL__TEXT__SEARCH_ENABLED: "true"
      DOCSPELL_SERVER_FULL__TEXT__SEARCH_SOLR_URL: http://solr:8983/solr/docspell
      DOCSPELL_SERVER_INTEGRATION__ENDPOINT_ENABLED: "true"
      DOCSPELL_SERVER_INTEGRATION__ENDPOINT_HTTP__BASIC_ENABLED: "false"
      DOCSPELL_SERVER_INTEGRATION__ENDPOINT_HTTP__HEADER_ENABLED: "true"
      # Header-Name an den passen, was connectors/common/docspell_client.py
      # tatsächlich sendet ("Docspell-Integration-Secret"), statt Docspells
      # eigenen Default ("Docspell-Integration") zu verwenden.
      DOCSPELL_SERVER_INTEGRATION__ENDPOINT_HTTP__HEADER_HEADER__NAME: "Docspell-Integration-Secret"
      DOCSPELL_SERVER_INTEGRATION__ENDPOINT_HTTP__HEADER_HEADER__VALUE: ${DOCSPELL_INTEGRATION_SECRET}
      # Nodes (restserver/joex) registrieren sich gegenseitig unter dieser Adresse
      # in der DB, um sich direkt über neue/fertige Jobs zu benachrichtigen
      # (docspell.pubsub.naive.NaivePubSub). Default ist "http://localhost:7880" —
      # das zeigt aus Sicht von joex (anderer Container!) ins Leere ("Connection
      # refused"), wodurch neue Jobs erst nach einem manuellen joex-Neustart
      # aufgegriffen wurden, statt sofort benachrichtigt zu werden.
      DOCSPELL_SERVER_INTERNAL__URL: http://docspell-restserver:7880
      # Für die Ersteinrichtung (Konten für Benedikt/Edwin anlegen) in .env kurz
      # DOCSPELL_SIGNUP_MODE=open setzen, "docker compose up -d" laufen lassen,
      # Konten unter http://localhost:7880 anlegen, danach unbedingt wieder auf
      # "closed" zurückstellen (und erneut "up -d") — "closed" ist der sichere
      # Normalzustand, in dem niemand mehr neue Konten anlegen kann.
      DOCSPELL_SERVER_BACKEND_SIGNUP_MODE: ${DOCSPELL_SIGNUP_MODE:-closed}
      # Ohne das bindet Docspell nur an 127.0.0.1 IM CONTAINER (siehe Log-Zeile
      # "Ember-Server service bound to address: 127.0.0.1:7880") — dadurch ist
      # es weder über den published Port noch von anderen Containern im
      # gleichen Docker-Netz erreichbar, und der Healthcheck oben schlägt fehl.
      DOCSPELL_SERVER_BIND_ADDRESS: "0.0.0.0"
    volumes:
      - ./data/docspell-files:/opt/docspell/files
      - ./docspell/docspell-server.conf:/opt/docspell.conf:ro
    ports:
      # Standardmässig nur an localhost gebunden — Zugriff von einem anderen
      # Rechner nur per SSH-Tunnel oder VPN. Falls SSH-Portforwarding auf dem
      # NAS serverseitig deaktiviert ist ("administratively prohibited"),
      # DOCSPELL_BIND_HOST in .env vorübergehend auf 0.0.0.0 stellen (dann per
      # http://<NAS-LAN-IP>:7880 direkt aus dem eigenen Netz erreichbar, aber
      # NICHT aus dem Internet, solange der Router den Port nicht weiterleitet)
      # und danach wieder auf 127.0.0.1 zurückstellen.
      - "${DOCSPELL_BIND_HOST:-127.0.0.1}:7880:7880"
    healthcheck:
      # Kein curl/wget vorausgesetzt — reiner TCP-Connect-Test per Bash, das im
      # Docspell-Image vorhanden ist (sbt-native-packager-Basis). WICHTIG: explizit
      # "bash -c" statt CMD-SHELL, da CMD-SHELL immer /bin/sh nutzt — und das ist in
      # diesem Image kein Bash-Symlink, kennt die /dev/tcp-Umleitung also nicht
      # ("cannot create /dev/tcp/... Directory nonexistent"), obwohl der Server
      # selbst längst erreichbar ist.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7880 && exec 3<&-"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - internal
      - hostaccess

  docspell-joex:
    image: ghcr.io/docspell/joex:${DOCSPELL_VERSION}
    restart: unless-stopped
    # OCR/Textanalyse braucht mehr Headroom als restserver — bei häufigen
    # Out-of-Memory-Abbrüchen (siehe docs/deploy-qnap.md) hier zuerst erhöhen,
    # notfalls auf Kosten von solr/db.
    mem_limit: 768m
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
    environment:
      DOCSPELL_JOEX_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DOCSPELL_JOEX_JDBC_USER: ${POSTGRES_USER}
      DOCSPELL_JOEX_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      # Gleiche Env-Var-Syntax-Regel wie bei docspell-restserver oben: "full-text-
      # search" enthält Bindestriche, daher doppelter statt einfacher Unterstrich.
      DOCSPELL_JOEX_FULL__TEXT__SEARCH_ENABLED: "true"
      DOCSPELL_JOEX_FULL__TEXT__SEARCH_SOLR_URL: http://solr:8983/solr/docspell
      # Gleicher Grund wie DOCSPELL_SERVER_INTERNAL__URL oben: joex registriert sich
      # unter dieser Adresse, damit restserver es direkt über neue Jobs
      # benachrichtigen kann. Default "http://localhost:7878" zeigt aus Sicht von
      # restserver (anderer Container!) ins Leere.
      DOCSPELL_JOEX_BASE__URL: http://docspell-joex:7878
      # Stanford-NLP (Korrespondent-/Datum-Vorschläge, Auto-Tagging) braucht laut
      # Docspell-Doku selbst im leichtesten Modus ("basic") ~500M Heap, im vollen
      # Modus ("full", der Default) >=1400M — beides sprengt den mem_limit dieses
      # Containers auf der schwachen NAS-Hardware bei weitem (beobachtet:
      # "OutOfMemoryError: Java heap space" beim Laden des deutschen Stanford-NLP-
      # Modells während der Textanalyse). Betrifft nur Vorschläge/Auto-Tagging,
      # NICHT Upload, OCR-Texterkennung oder Volltextsuche — die bleiben unberührt.
      DOCSPELL_JOEX_TEXT__ANALYSIS_NLP_MODE: "disabled"
      DOCSPELL_JOEX_TEXT__ANALYSIS_CLASSIFICATION_ENABLED: "false"
      # Gleicher Grund wie bei docspell-restserver oben: ohne das bindet joex
      # nur an 127.0.0.1 im Container und ist dann selbst für restserver (das
      # joex intern per HTTP über den Docker-Netzwerknamen "docspell-joex"
      # ueber neue Jobs benachrichtigt) nicht erreichbar.
      DOCSPELL_JOEX_BIND_ADDRESS: "0.0.0.0"
    volumes:
      - ./data/docspell-files:/opt/docspell/files
      - ./docspell/docspell-joex.conf:/opt/docspell.conf:ro
    networks:
      - internal

  connector-gmail:
    build:
      context: .
      dockerfile: connectors/gmail/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      docspell-restserver:
        condition: service_healthy
    environment:
      DOCSPELL_BASE_URL: ${DOCSPELL_BASE_URL}
      DOCSPELL_COLLECTIVE: ${DOCSPELL_COLLECTIVE}
      DOCSPELL_INTEGRATION_SECRET: ${DOCSPELL_INTEGRATION_SECRET}
      GMAIL_POLL_INTERVAL_SECONDS: ${GMAIL_POLL_INTERVAL_SECONDS}
      GMAIL_LABEL: ${GMAIL_LABEL}
      GMAIL_ALERT_AFTER_FAILURES: ${GMAIL_ALERT_AFTER_FAILURES}
      NTFY_URL: ${NTFY_URL}
      NTFY_TOPIC: ${NTFY_TOPIC}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO}
    volumes:
      - ./connectors/gmail/secrets:/secrets
      - ./config/sources.yaml:/config/sources.yaml:ro
      - ./data/state:/state
    networks:
      - internal
      - internet

  connector-dropzone:
    build:
      context: .
      dockerfile: connectors/dropzone/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      docspell-restserver:
        condition: service_healthy
    environment:
      DOCSPELL_BASE_URL: ${DOCSPELL_BASE_URL}
      DOCSPELL_COLLECTIVE: ${DOCSPELL_COLLECTIVE}
      DOCSPELL_INTEGRATION_SECRET: ${DOCSPELL_INTEGRATION_SECRET}
      DROPZONE_POLL_INTERVAL_SECONDS: ${DROPZONE_POLL_INTERVAL_SECONDS}
      DROPZONE_ALERT_AFTER_FAILURES: ${DROPZONE_ALERT_AFTER_FAILURES}
      NTFY_URL: ${NTFY_URL}
      NTFY_TOPIC: ${NTFY_TOPIC}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO}
    volumes:
      - ${DROPZONE_HOST_PATH}:/dropzone
      - ./data/state:/state
    networks:
      - internal
      # Nur für optionale ntfy-Alarme nötig — die eigentliche Dropzone-Funktion
      # (Ordner beobachten, zu Docspell hochladen) braucht kein Internet.
      - internet

  # Baut den Jahr/Monat-Ordnerbaum für den Steuerberater (./data/belege-nach-
  # monat) NICHT aus einer Näherung beim Upload, sondern periodisch aus
  # Docspells eigenem, von der OCR erkannten (oder manuell korrigierten)
  # Beleg-Datum — erfasst dabei auch Dokumente, die jemand direkt in
  # Docspells Web-UI hochlädt. Braucht dafür einen normalen Docspell-Login
  # (DOCSPELL_ACCOUNT/DOCSPELL_PASSWORD, gleiche Variablen wie beim
  # Steuerberater-Export), keinen Integration-Endpoint. Details:
  # connectors/mirror-sync/mirror_sync.py.
  connector-mirror-sync:
    build:
      context: .
      dockerfile: connectors/mirror-sync/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      docspell-restserver:
        condition: service_healthy
    environment:
      DOCSPELL_BASE_URL: ${DOCSPELL_BASE_URL}
      DOCSPELL_ACCOUNT: ${DOCSPELL_ACCOUNT}
      DOCSPELL_PASSWORD: ${DOCSPELL_PASSWORD}
      MIRROR_SYNC_POLL_INTERVAL_SECONDS: ${MIRROR_SYNC_POLL_INTERVAL_SECONDS}
      MIRROR_SYNC_ALERT_AFTER_FAILURES: ${MIRROR_SYNC_ALERT_AFTER_FAILURES}
      NTFY_URL: ${NTFY_URL}
      NTFY_TOPIC: ${NTFY_TOPIC}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO}
    volumes:
      - ./data/state:/state
      - ${MONTHLY_MIRROR_HOST_PATH}:/monthly
    networks:
      - internal
      # Nur für optionale ntfy-Alarme nötig.
      - internet

  # Syncthing für den Handy-Scanner: synct einen Ordner vom Handy direkt in
  # ./data/dropzone, ohne Cloud-Zwischenstation. Web-UI zur Einrichtung (Geräte
  # koppeln, Ordner freigeben) nur per SSH-Tunnel erreichbar, wie bei Docspell.
  # Details: connectors/dropzone/README.md.
  syncthing:
    image: syncthing/syncthing:${SYNCTHING_VERSION}
    restart: unless-stopped
    mem_limit: 256m
    hostname: belegwirtschaft-nas
    environment:
      PUID: 0
      PGID: 0
    volumes:
      - ./data/syncthing:/var/syncthing
      - ${DROPZONE_HOST_PATH}:/var/syncthing/dropzone
    ports:
      # Gleicher Grund/gleiches Muster wie DOCSPELL_BIND_HOST: Web-UI ist per
      # Default nur per SSH-Tunnel erreichbar. Falls SSH-Portforwarding auf dem
      # NAS serverseitig deaktiviert ist, SYNCTHING_BIND_HOST in .env
      # vorübergehend auf 0.0.0.0 stellen (dann per http://<NAS-LAN-IP>:8384
      # erreichbar, um das Handy zu koppeln) und danach wieder auf 127.0.0.1
      # zurückstellen.
      - "${SYNCTHING_BIND_HOST:-127.0.0.1}:8384:8384"
      - "22000:22000/tcp"        # Sync-Protokoll, muss vom Handy im LAN erreichbar sein
      - "22000:22000/udp"
      - "21027:21027/udp"        # Lokale Geräte-Erkennung im selben Netz
    networks:
      - internet

  # Tailscale: sicherer Fernzugriff auf Docspell + Syncthing ohne offene Ports
  # am Router und ohne das (auf dieser NAS serverseitig deaktivierte)
  # SSH-Portforwarding. Verbindet sich mit eurem privaten Tailscale-Netz
  # ("Tailnet") und leitet die beiden Web-Oberflächen als reines TCP weiter —
  # bewusst KEIN HTTPS/TLS-Reverse-Proxy (Tailscale Serve im HTTPS-Modus), das
  # würde zusätzlich "HTTPS Certificates" im Tailscale-Adminkonsole erfordern.
  # Reines TCP reicht: die Verbindung ist durch WireGuard (Tailscales
  # zugrundeliegendes VPN-Protokoll) ohnehin schon verschlüsselt.
  # Setup: siehe docs/tailscale-remote-access.md.
  tailscale:
    image: tailscale/tailscale:${TAILSCALE_VERSION}
    restart: unless-stopped
    mem_limit: 128m
    hostname: ${TAILSCALE_HOSTNAME:-belegwirtschaft}
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      docspell-restserver:
        condition: service_healthy
    networks:
      # Muss beide Netze sehen, um "docspell-restserver" (hostaccess) und
      # "syncthing" (internet) per Docker-DNS-Namen zu erreichen — plus
      # generell Internetzugriff, um sich mit Tailscales Koordinationsserver
      # zu verbinden.
      - hostaccess
      - internet

  # Kein Dauer-Dienst, sondern ein On-Demand-Werkzeug: läuft nur, wenn ihr
  # explizit einen Steuerberater-Export braucht (Python ist auf QNAP/QTS nicht
  # selbstverständlich vorhanden, deshalb containerisiert statt "einfach lokal
  # ausführen"). "profiles: tools" verhindert, dass es bei "docker compose up"
  # automatisch mitstartet.
  #
  # Aufruf:
  #   docker compose run --rm export-tax-advisor --year 2026 --out /data/export-2026.zip
  # Landet danach unter ./data/export-2026.zip auf dem Host (per File Station
  # abrufbar, wie alles andere unter ./data).
  export-tax-advisor:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: scripts/Dockerfile
    mem_limit: 128m
    environment:
      DOCSPELL_BASE_URL: ${DOCSPELL_BASE_URL}
      DOCSPELL_ACCOUNT: ${DOCSPELL_ACCOUNT}
      DOCSPELL_PASSWORD: ${DOCSPELL_PASSWORD}
    volumes:
      - ./data:/data
    networks:
      - internal

  # Ebenfalls kein Dauer-Dienst: läuft nur, wenn per Cron aufgerufen (siehe
  # scripts/backup.sh Kopfzeilen für den Cron-Eintrag). restic ist auf dieser
  # NAS nicht ohne Weiteres nativ installierbar — deshalb containerisiert,
  # analog zu den Python-Connectors.
  #
  # Aufruf: docker compose run --rm backup
  backup:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: scripts/Dockerfile.backup
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
    volumes:
      - ./data:/data
      # Nur nötig, wenn RESTIC_REPOSITORY ein lokaler Dateipfad ist (Default,
      # z.B. eine gemountete externe Platte). Bei einem Remote-Backend
      # (s3:..., sftp:..., rest:...) diese Zeile entfernen — dann reicht das
      # "internet"-Netzwerk unten.
      - ${RESTIC_REPOSITORY}:${RESTIC_REPOSITORY}
    networks:
      - internal
      - internet
    depends_on:
      db:
        condition: service_healthy

networks:
  # Docspell-Kern + DB + Solr reden nur miteinander, kein Internetzugriff nötig/erlaubt.
  internal:
    internal: true
  # Nur die Connectors + Syncthing hängen zusätzlich hier dran (Gmail-API,
  # Handy-Sync, optional ntfy).
  internet:
    driver: bridge
  # Nur für docspell-restserver zusätzlich zu "internal": ein "internal: true"-
  # Netzwerk lässt Docker grundsätzlich keine Ports zum Host durchreichen (kein
  # Docspell-spezifisches Problem, gilt für jeden Container, der ausschliesslich
  # an einem internen Netzwerk hängt) — ohne dieses zweite, normale Bridge-Netz
  # bliebe "127.0.0.1:7880:7880" unten wirkungslos, obwohl Docker die Bindung
  # anstandslos entgegennimmt. db/solr/joex bleiben unberührt davon, da sie
  # weiterhin nur an "internal" hängen.
  hostaccess:
    driver: bridge
